name: Windows installer

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: windows-release
  cancel-in-progress: false

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[release]')
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test
        run: npm test
      - name: Build Windows installer
        run: npm run dist -- --publish never
      - name: Publish release with installer and checksum
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content -Raw package.json | ConvertFrom-Json).version
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'Invalid release version.' }
          $tag = "v$version"
          $installer = "release/Nexus-Hub-Setup-$version.exe"
          $checksum = "release/SHA256-$version.txt"
          $metadata = 'release/latest.yml'
          $blockmap = "$installer.blockmap"
          foreach ($file in @($installer, $metadata, $blockmap)) {
            if (!(Test-Path -LiteralPath $file)) { throw "Missing update asset: $file" }
          }
          $hash = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash
          Set-Content -LiteralPath $checksum -Value "$hash  Nexus-Hub-Setup-$version.exe" -Encoding utf8
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) { throw "Release $tag already exists; existing downloads will not be overwritten." }
          gh release create $tag $installer $checksum $metadata $blockmap --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "Nexus Hub $version" --notes-file .github/release-notes.md --draft
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed.' }
          gh release edit $tag --repo $env:GITHUB_REPOSITORY --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed.' }
